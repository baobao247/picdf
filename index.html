<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image to PDF | Tech Edition</title>
    <!-- Tích hợp thư viện jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --primary: #00f0ff;
            --primary-glow: rgba(0, 240, 255, 0.4);
            --bg-color: #0b0f19;
            --panel-bg: #111827;
            --text-color: #e2e8f0;
            --border-color: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 240, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(0, 240, 255, 0.05), transparent 25%);
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #fff;
        }

        h1 span {
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        p.subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* Khu vực Upload / Dropzone */
        .dropzone {
            border: 2px dashed #334155;
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(30, 41, 59, 0.3);
            position: relative;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--primary);
            background: rgba(0, 240, 255, 0.05);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .dropzone i {
            font-size: 3rem;
            color: var(--primary);
            margin-bottom: 1rem;
            display: block;
        }

        .dropzone p {
            color: #cbd5e1;
            font-size: 1.1rem;
        }

        .dropzone .highlight {
            color: var(--primary);
            font-weight: bold;
        }

        input[type="file"] {
            display: none;
        }

        /* Nút chức năng */
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            background: transparent;
            color: #fff;
            border: 1px solid var(--primary);
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-primary:hover {
            background: #fff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
            border-color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(0, 240, 255, 0.1);
        }

        /* Lưới hiển thị ảnh Preview */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .preview-item {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            aspect-ratio: 1;
            border: 1px solid #334155;
            background: #000;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .remove-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            background: rgba(220, 38, 38, 0.8);
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: 0.2s;
        }

        .remove-btn:hover {
            background: rgba(220, 38, 38, 1);
            transform: scale(1.1);
        }

        .status {
            color: var(--primary);
            font-size: 0.9rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>SYS.<span>IMG2PDF</span></h1>
        <p class="subtitle">Công cụ kết hợp ảnh thành tài liệu PDF siêu tốc</p>

        <div class="dropzone" id="dropzone">
            <i>📁</i>
            <p>Kéo thả ảnh vào đây, <span class="highlight">Click</span> để chọn file</p>
            <p style="font-size: 0.85rem; color: #64748b; margin-top: 0.5rem;">HOẶC: Bấm <strong>Ctrl + V</strong> để dán ảnh trực tiếp từ Clipboard</p>
            <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, image/webp, image/jpg">
        </div>

        <div class="preview-grid" id="previewGrid">
            <!-- Ảnh xem trước sẽ hiện ở đây -->
        </div>

        <div class="actions">
            <span class="status" id="statusMsg">Đang xử lý PDF...</span>
            <button class="btn btn-secondary" id="clearBtn" style="display: none;">Xóa tất cả</button>
            <button class="btn btn-primary" id="generateBtn" style="margin-left: auto;">Tạo File PDF</button>
        </div>
    </div>

    <script>
        // Các biến lưu trữ
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewGrid = document.getElementById('previewGrid');
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const statusMsg = document.getElementById('statusMsg');
        
        let imagesData = []; // Mảng chứa dữ liệu ảnh gốc (Data URL)

        // ===== XỬ LÝ SỰ KIỆN CLICK & DRAG/DROP =====
        dropzone.addEventListener('click', () => fileInput.click());

        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });

        dropzone.addEventListener('dragleave', () => {
            dropzone.classList.remove('dragover');
        });

        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
            fileInput.value = ''; // Reset input
        });

        // ===== XỬ LÝ SỰ KIỆN DÁN ẢNH (CTRL+V) =====
        window.addEventListener('paste', (e) => {
            const items = e.clipboardData.items;
            const files = [];
            for (let i = 0; i < items.length; i++) {
                if (items[i].type.indexOf('image') !== -1) {
                    files.push(items[i].getAsFile());
                }
            }
            if (files.length > 0) {
                handleFiles(files);
            }
        });

        // ===== ĐỌC VÀ HIỂN THỊ ẢNH =====
        function handleFiles(files) {
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                if (!file.type.match('image.*')) continue;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const dataUrl = e.target.result;
                    imagesData.push(dataUrl);
                    renderPreview();
                };
                reader.readAsDataURL(file);
            }
        }

        // ===== RENDER LƯỚI ẢNH =====
        function renderPreview() {
            previewGrid.innerHTML = '';
            
            imagesData.forEach((data, index) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                
                const img = document.createElement('img');
                img.src = data;
                
                const btn = document.createElement('button');
                btn.className = 'remove-btn';
                btn.innerHTML = '✕';
                btn.onclick = (e) => {
                    e.stopPropagation();
                    imagesData.splice(index, 1);
                    renderPreview();
                };

                div.appendChild(img);
                div.appendChild(btn);
                previewGrid.appendChild(div);
            });

            clearBtn.style.display = imagesData.length > 0 ? 'block' : 'none';
        }

        clearBtn.addEventListener('click', () => {
            imagesData = [];
            renderPreview();
        });

        // ===== TẠO PDF BẰNG JSPDF =====
        generateBtn.addEventListener('click', async () => {
            if (imagesData.length === 0) {
                alert("Vui lòng thêm ít nhất 1 ảnh trước khi tạo PDF!");
                return;
            }

            statusMsg.style.display = 'block';
            statusMsg.innerText = 'Đang xử lý, vui lòng đợi...';
            generateBtn.disabled = true;

            try {
                // Khởi tạo jsPDF (A4, đơn vị mm)
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });

                for (let i = 0; i < imagesData.length; i++) {
                    await addImageToPdf(pdf, imagesData[i], i === 0);
                }

                // Lưu file
                pdf.save('Document_TechVibe.pdf');
                statusMsg.innerText = 'Thành công! Đã tải xuống.';
                setTimeout(() => { statusMsg.style.display = 'none'; }, 3000);

            } catch (error) {
                console.error(error);
                alert("Đã xảy ra lỗi khi tạo PDF.");
                statusMsg.style.display = 'none';
            } finally {
                generateBtn.disabled = false;
            }
        });

        // Hàm helper để tải ảnh và tính toán tỷ lệ khung hình vừa khổ A4
        function addImageToPdf(pdf, imgData, isFirstPage) {
            return new Promise((resolve) => {
                const img = new Image();
                img.src = imgData;
                img.onload = () => {
                    const pdfWidth = pdf.internal.pageSize.getWidth();
                    const pdfHeight = pdf.internal.pageSize.getHeight();
                    
                    // Tính toán tỷ lệ để ảnh vừa khổ A4 (giữ nguyên aspect ratio)
                    const ratio = Math.min(pdfWidth / img.width, pdfHeight / img.height);
                    const finalWidth = img.width * ratio;
                    const finalHeight = img.height * ratio;
                    
                    // Căn giữa ảnh
                    const x = (pdfWidth - finalWidth) / 2;
                    const y = (pdfHeight - finalHeight) / 2;

                    if (!isFirstPage) {
                        pdf.addPage();
                    }
                    
                    pdf.addImage(imgData, 'JPEG', x, y, finalWidth, finalHeight);
                    resolve();
                };
            });
        }
    </script>
</body>
</html>
